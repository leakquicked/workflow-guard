[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-guard"
version = "1.0.0"
description = "Static security checks for GitHub Actions workflow YAML"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7.0"]

[project.scripts]
workflow-guard = "workflow_guard:main"

[tool.setuptools]
py-modules = ["workflow_guard"]
